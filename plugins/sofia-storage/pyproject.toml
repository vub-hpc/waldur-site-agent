[project]
name = "waldur-site-agent-sofia-storage"
version = "0.5.0"
description = "Sofia cluster GPFS storage plugin for Waldur Site Agent"
readme = "README.md"
authors = [{ name = "VUB HPC Team", email = "hpc@vub.be" }]
requires-python = ">=3.12, <4"
dependencies = [
    "waldur-site-agent>=0.7.0",
    "vsc-accountpage-clients",
    "vsc-filesystems",
]

[tool.pytest.ini_options]
# Makes `pytest` work from inside this directory without the package being
# installed (e.g. without uv): the plugin directory is put on sys.path and
# this directory becomes the pytest rootdir (so no repo-root addopts apply).
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["waldur_site_agent_sofia_storage"]

[tool.hatch.build.targets.sdist]
include = ["waldur_site_agent_sofia_storage"]

[tool.uv.sources]
waldur-site-agent = { workspace = true }

# Entry points for exporting backends
[project.entry-points."waldur_site_agent.backends"]
sofia_storage = "waldur_site_agent_sofia_storage.backend:SofiaStorageBackend"

# Entry points for executables
[project.scripts]
waldur_make_homedir_vsc = "waldur_site_agent_sofia_storage.mkhomedir:main"
waldur_make_project_vsc = "waldur_site_agent_sofia_storage.mkprojdir:main"
waldur_set_project_quota = "waldur_site_agent_sofia_storage.setprojquota:main"
